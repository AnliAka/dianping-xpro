# 本地开发用编排：MySQL 8 + Redis 7 + RocketMQ + Canal + OpenResty，可选双应用实例。
#
# 常用命令（在项目根目录执行）：
#   docker compose up -d mysql redis      # 只起中间件，应用在 IDE / java -jar 里跑
#   docker compose up -d --build          # 连应用镜像一起构建并启动
#   docker compose logs -f app-1 app-2    # 跟踪两个应用实例日志
#   docker compose down                   # 停止并删除容器（数据卷保留）
#   docker compose down -v                # 连同数据卷一起删除，慎用
#
# 宿主机端口刻意避开常用默认值，防止和本机已装的 MySQL / Redis 冲突。

services:
  mysql:
    image: mysql:8.4
    container_name: dianping-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: ${DB_NAME:-dianping_xpro}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动（数据卷为空）时自动执行建库脚本。
      # 已有数据卷时不会重跑，需要重跑请先 docker compose down -v。
      - ./src/main/resources/db/dianping-xpro.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/db/20260919-canal-user.sql:/docker-entrypoint-initdb.d/02-canal-user.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: dianping-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-1}
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    # 秒杀链路依赖 Redis Stream + 消费者组，重启后不能丢。
    # 开启 AOF everysec：最多丢 1 秒数据，同时保留 RDB 快照做冷备。
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-1}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "900 1"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # RocketMQ 事务消息。namesrv 供客户端寻址，broker 承载半消息与事务回查。
  # broker 上报 host.docker.internal，经端口映射同时供宿主机应用与容器内 Canal 访问。
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: dianping-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n 127.0.0.1:9876 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: dianping-rocketmq-broker
    restart: unless-stopped
    # named volume 由 Docker 以 root 创建，而镜像默认以 rocketmq(uid 3000) 运行，
    # 无权写入 store/logs。broker 会在启动阶段失败并以退出码 255 反复重启，
    # 且失败信息被 logback 初始化日志吞掉，只留下一段 shutdown 的 NPE。
    # 开发环境以 root 运行规避；生产应改用 chown 初始化或 fsGroup。
    user: root
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "${ROCKETMQ_BROKER_VIP_PORT:-10909}:10909"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      # 镜像基于 JDK 8，runbroker.sh 已带 G1 相关参数（不支持固定 -Xmn），
      # 追加 -Xmn 会让 JVM 启动失败，表现为容器以退出码 255 反复重启。这里只限制堆上下限。
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 必须挂到镜像里已存在的 conf 目录。挂到不存在的路径时 Docker 建出的是目录而不是文件，
    # -c 会读到 FileNotFoundException 并以退出码 255 直接退出。
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.1.4/conf/my-broker.conf
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.1.4/conf/my-broker.conf:ro
      - rocketmq-broker-store:/home/rocketmq/store
      # 注意：broker 以 root 运行（见上方 user: root），user.home=/root，
      # RocketMQ 按 ${user.home}/logs/rocketmqlogs 写日志，所以这里必须挂 /root/logs。
      # 挂到 /home/rocketmq/logs 只会得到一个空目录，日志被留在容器可写层里、down 即丢，
      # 而 transaction.log（事务回查的唯一记录）也就在那里。
      - rocketmq-broker-logs:/root/logs

  # 订阅 MySQL ROW binlog，仅筛选 dianping_xpro.tb_shop，并以 flat JSON 投递 RocketMQ。
  # 应用只读取主键并做缓存失效，不用 binlog 里的 before/after 值回写缓存。
  canal-server:
    image: canal/canal-server:v1.1.7
    container_name: dianping-canal
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    environment:
      canal.auto.scan: "false"
      canal.destinations: shop
      canal.serverMode: rocketMQ
      canal.instance.master.address: mysql:3306
      canal.instance.dbUsername: canal
      canal.instance.dbPassword: canal
      canal.instance.connectionCharset: UTF-8
      canal.instance.filter.regex: "${DB_NAME:-dianping_xpro}\\.tb_shop"
      canal.mq.topic: shop-binlog-topic
      canal.mq.flatMessage: "true"
      rocketmq.producer.group: canal-shop-binlog-producer
      rocketmq.namesrv.addr: rocketmq-namesrv:9876
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - canal-logs:/home/admin/canal-server/logs

  # 单节点 OpenResty 秒杀网关（双层限流第一层：共享状态原子令牌桶）。
  # 请求经 8080 进入网关，仅 POST /voucher-order/seckill/{id} 受令牌桶约束，其余路径仅转发。
  # 应用地址在 nginx.conf 的 upstream app_backend 里（默认 host.docker.internal:8081），
  # 双实例容器模式下该地址经 8081 端口映射进入 app-1；app-2 可由 8082 直接访问验证。
  # 令牌桶速率为 T3 容量实验前的占位值，实验后固定，勿凭感觉调。
  openresty:
    image: openresty/openresty:alpine
    container_name: dianping-openresty
    restart: unless-stopped
    ports:
      - "${OPENRESTY_PORT:-8080}:80"
    environment:
      SECKILL_GATEWAY_ENABLED: ${SECKILL_GATEWAY_ENABLED:-true}
      SECKILL_TOKEN_RATE: ${SECKILL_TOKEN_RATE:-500}
      SECKILL_TOKEN_BURST: ${SECKILL_TOKEN_BURST:-1000}
    volumes:
      - ./docker/openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./docker/openresty/lua:/usr/local/openresty/nginx/lua:ro

  # 两个应用实例。默认不随 up 启动，用 profile 控制：
  #   docker compose --profile app up -d --build
  # 两个实例使用不同的本地失效消费组，因此同一条通知会各消费一次。
  app-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: dianping-xpro:latest
    container_name: dianping-app-1
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_healthy
      canal-server:
        condition: service_started
    environment:
      # 容器内用服务名寻址，覆盖 application.yml 里的本机地址。
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      SPRING_DATASOURCE_URL: >-
        jdbc:mysql://mysql:3306/${DB_NAME:-dianping_xpro}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-1}
      APP_INSTANCE_ID: app-1
      SHOP_LOCAL_CACHE_ENABLED: ${SHOP_LOCAL_CACHE_ENABLED:-true}
      SHOP_LOCAL_CACHE_CONSUMER_GROUP: dianping-shop-local-app-1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_1_PORT:-8081}:8081"
    volumes:
      # 本机私有配置挂进来，覆盖镜像内的默认值。
      # 文件不随构建进镜像，密码不落盘到镜像层。
      - ./config:/app/config:ro

  app-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: dianping-xpro:latest
    container_name: dianping-app-2
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_healthy
      canal-server:
        condition: service_started
    environment:
      ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
      SPRING_DATASOURCE_URL: >-
        jdbc:mysql://mysql:3306/${DB_NAME:-dianping_xpro}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-1}
      APP_INSTANCE_ID: app-2
      SHOP_LOCAL_CACHE_ENABLED: ${SHOP_LOCAL_CACHE_ENABLED:-true}
      SHOP_LOCAL_CACHE_CONSUMER_GROUP: dianping-shop-local-app-2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_2_PORT:-8082}:8081"
    volumes:
      - ./config:/app/config:ro

volumes:
  mysql-data:
  redis-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-store:
  rocketmq-broker-logs:
  canal-logs:
