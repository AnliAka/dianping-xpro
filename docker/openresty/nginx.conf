# 单节点 OpenResty 秒杀网关（双层限流第一层）。
#
# 职责：仅对「新秒杀请求」（POST /voucher-order/seckill/{voucherId}）施加全局令牌桶，
# 限制秒杀入口的总速率与突发容量；其余路径只转发，不限流。
# 拒绝发生在应用预占之前，以 HTTP 429 返回，并在共享内存中计数、在访问日志中打标。
#
# 参数通过环境变量注入（T3 容量实验前为占位值，实验后固定）：
#   SECKILL_GATEWAY_ENABLED  是否启用令牌桶（false = 仅转发，对照组 A）
#   SECKILL_TOKEN_RATE       令牌产生速率（个/秒）
#   SECKILL_TOKEN_BURST      桶容量，即允许的突发请求数
# 应用地址固定为 upstream app_backend（默认 host.docker.internal:8081）

worker_processes auto;
error_log /dev/stderr warn;

# env 指令把宿主机环境变量暴露给 Lua 的 os.getenv，否则 worker 内一律不可见。
env SECKILL_GATEWAY_ENABLED;
env SECKILL_TOKEN_RATE;
env SECKILL_TOKEN_BURST;

events {
    worker_connections 4096;
}

http {
    # 上游连接池：秒杀链路 QPS 高，必须复用到应用的连接。
    # 不配 keepalive 时每请求新建一条 TCP，经 Docker Desktop 宿主机端口代理
    # 转发会被拒连（Connection refused），表现为大量 502——T3 压测实测 3.5 万个。
    # 应用改跑容器时把 server 换成 app:8081。
    upstream app_backend {
        server host.docker.internal:8081;
        keepalive 128;
        keepalive_requests 100000;
        keepalive_timeout 60s;
    }

    # 令牌桶状态（tokens|last_refill_ms），跨 worker 共享，是「共享状态原子令牌桶」的落点。
    lua_shared_dict seckill_bucket 1m;
    # 网关计数器：total / passed / rejected，供压测核对网关拒绝率。
    lua_shared_dict seckill_stats 1m;

    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    # gw_reject 由秒杀 location 里的 Lua 置 1，访问日志据此区分网关拒绝与上游响应。
    log_format seckill '$remote_addr [$time_local] "$request" $status '
                        'gw_reject=$gw_reject rt=$request_time';
    access_log /dev/stdout seckill;

    server {
        listen 80;

        # 网关计数查询：不转发应用，压测期间轮询读取令牌桶的三类计数。
        location = /gateway/stats {
            content_by_lua_block {
                require("gw_stats").show()
            }
        }

        # 秒杀入口：先过令牌桶再转发。仅匹配下单请求，支付/取消/查询不限流。
        location ~ ^/voucher-order/seckill/\d+$ {
            set $gw_reject 0;
            access_by_lua_block {
                require("seckill_gate").run()
            }
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 其余路径仅转发（登录、支付、查询等），构成对照组 A/B 的「网关仅转发」行为。
        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
