# RocketMQ broker 配置（本地开发用）。
# 由 compose.yaml 的 rocketmq-broker 服务挂载到 /home/rocketmq/conf/broker.conf。

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

deleteWhen = 04
fileReservedTime = 48

# 单机开发取性能优先：异步主、异步刷盘。
# 若要验证「半消息已落盘则重启不丢」，需改为 SYNC_FLUSH，并相应放宽容错时间。
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 应用在宿主机（IDE 或 java -jar）运行而非容器内，broker 需上报宿主机可达的地址。
# 配合 compose 里 10911 的端口映射，客户端才能连上 broker。
brokerIP1 = 127.0.0.1

# 事务消息回查。超过 transactionTimeOut 未收到 Commit/Rollback 即发起回查，
# 最多回查 transactionCheckMax 次；耗尽后半消息被丢弃。
# Redis 中 seckill:tx:{orderId} 的 TTL 必须覆盖这个总窗口。
transactionTimeOut = 6000
transactionCheckMax = 15
transactionCheckInterval = 60000

# 开发环境自动创建 Topic 与订阅组，省去手工 mqadmin 操作。
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
