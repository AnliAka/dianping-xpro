server:
  port: 8081
spring:
  application:
    name: dianping-xpro
  config:
    # IDE 和 java -jar 均从工作目录读取本机私有配置。
    import: optional:file:./config/application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:dianping_xpro}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
  data:
    redis:
      host: 192.168.80.133
      port: 6379
      lettuce:
        pool:
          max-active: 10
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 下划线映射为驼峰命名
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL语句
